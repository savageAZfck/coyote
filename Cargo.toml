[package]
name = "coyote-lang"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "bare-metal language for sovereign computation — source to silicon"

[lib]
name = "coyote"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "coyote"
path = "src/main.rs"

[dependencies]
mil_infer = { git = "https://github.com/savageAZfck/mil_spec", version = "0.6" }
half = "2"
serde = { version = "1", features = ["derive"] }
